name: ML Delivery

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    timeout-minutes: 30

    outputs:
      image_ref: ${{ steps.image_ref.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create image name
        id: naming
        run: |
          IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.naming.outputs.image_name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Export image reference
        id: image_ref
        run: |
          echo "image_ref=${{ steps.naming.outputs.image_name }}@${{ steps.build_push.outputs.digest }}" >> $GITHUB_OUTPUT